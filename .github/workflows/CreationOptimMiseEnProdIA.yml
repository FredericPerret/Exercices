name: CI CreationOptimMiseEnProdIA

on:
  push:
    paths:
          - "CreationOptimMiseEnProdIA/**"
          - "!CreationOptimMiseEnProdIA/**/*.md"
          - "!CreationOptimMiseEnProdIA/**/*.ipynb"
          - "!CreationOptimMiseEnProdIA/**/*.png"
          - ".github/workflows/CreationOptimMiseEnProdIA.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Installation des dépendances
        working-directory: CreationOptimMiseEnProdIA
        run: |
          pip install -r requirements.txt
          pip install pytest httpx2 pandas

      - name: Tests
        working-directory: CreationOptimMiseEnProdIA
        run: python -m pytest

  img:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Construction de l'image Docker
        working-directory: CreationOptimMiseEnProdIA
        run: docker build -t api-films .

      - name: Démarrage du conteneur
        run: docker run -d -p 8000:8000 --name api-films api-films

      - name: Vérification du démarrage de l'API
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done

          docker logs api-films
          exit 1

      - name: Sauvegarde de l'image Docker
        run: docker save api-films -o api-films.tar

      - name: Transmission de l'image au job suivant
        uses: actions/upload-artifact@v4
        with:
          name: api-films
          path: api-films.tar

  publier:
    needs: img
    runs-on: ubuntu-latest

    steps:
      - name: Récupération de l'image
        uses: actions/download-artifact@v4
        with:
          name: api-films

      - name: Chargement de l'image Docker
        run: docker load -i api-films.tar

      - name: Connexion au registre Azure
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_REGISTRY }} \
            --username "${{ secrets.ACR_USERNAME }}" \
            --password-stdin

      - name: Étiquetage de l'image
        run: |
          docker tag api-films ${{ secrets.ACR_REGISTRY }}/api-films:${{ github.sha }}

      - name: Publication de l'image
        run: |
          docker push ${{ secrets.ACR_REGISTRY }}/api-films:${{ github.sha }}